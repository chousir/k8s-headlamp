---
- name: Render /etc/helm/headlamp-values.yaml
  ansible.builtin.template:
    src: headlamp-values.yaml.j2
    dest: /etc/helm/headlamp-values.yaml
    mode: "0600"

- name: Render /etc/k8s/headlamp-rbac.yaml
  ansible.builtin.template:
    src: headlamp-rbac.yaml.j2
    dest: /etc/k8s/headlamp-rbac.yaml
    mode: "0600"

# ── 映像枚舉預檢(對應 headlamp-offline.md 2.4),避免 tag 沒推對而 ImagePullBackOff ──
- name: Render Headlamp chart templates for image audit
  ansible.builtin.command:
    argv:
      - helm
      - template
      - headlamp
      - nexus/headlamp
      - --version
      - "{{ headlamp_chart_version }}"
      - -n
      - kube-system
      - -f
      - /etc/helm/headlamp-values.yaml
  register: headlamp_template
  changed_when: false

- name: Extract Headlamp image references
  ansible.builtin.set_fact:
    headlamp_images: "{{ headlamp_template.stdout | regex_findall('image:\\s*\"?([^\"\\s]+)\"?') }}"

- name: Fail if no Headlamp image was found in rendered chart
  ansible.builtin.assert:
    that: headlamp_images | length > 0
    fail_msg: "helm template 輸出中找不到任何 image:,預檢無法判斷,請手動執行 headlamp-offline.md 2.4"

- name: Fail if any Headlamp image does not come from Nexus registry
  ansible.builtin.assert:
    that: "item.startswith(registry_host ~ '/')"
    fail_msg: "Image 未指向 {{ registry_host }},先依 headlamp-offline.md 2.1/2.2 補推: {{ item }}"
  loop: "{{ headlamp_images }}"

# ── 安裝 ──
- name: Install/upgrade Headlamp
  ansible.builtin.command:
    argv:
      - helm
      - upgrade
      - --install
      - headlamp
      - nexus/headlamp
      - --version
      - "{{ headlamp_chart_version }}"
      - -n
      - kube-system
      - -f
      - /etc/helm/headlamp-values.yaml
  # helm upgrade --install 的純 CLI 輸出無法可靠判斷是否真的無變化(沒有 kubernetes.core/helm-diff
  # 可用來做 dry-run diff),因此一律視為 changed——這是刻意的取捨,不是遺漏。
  changed_when: true

- name: Apply Headlamp RBAC (ServiceAccount / ClusterRoleBinding / token Secret)
  ansible.builtin.command:
    argv: [kubectl, apply, -f, /etc/k8s/headlamp-rbac.yaml]
  register: headlamp_rbac_apply
  changed_when: headlamp_rbac_apply.stdout is search('(created|configured)')

- name: Wait for Headlamp rollout
  ansible.builtin.command:
    argv: [kubectl, -n, kube-system, rollout, status, deploy/headlamp, --timeout=180s]
  changed_when: false

# ── Token(可選,預設關閉印出,避免 cluster-admin 權限的憑證外洩到 ansible log)──
- name: Fetch Headlamp long-term token secret (opt-in only)
  ansible.builtin.command:
    argv: [kubectl, -n, kube-system, get, secret, headlamp-admin-token, -o, "jsonpath={.data.token}"]
  register: headlamp_token_b64
  changed_when: false
  no_log: true
  when: headlamp_show_token

- name: Show decoded Headlamp token (opt-in only)
  ansible.builtin.debug:
    msg: "{{ headlamp_token_b64.stdout | b64decode }}"
  when: headlamp_show_token
