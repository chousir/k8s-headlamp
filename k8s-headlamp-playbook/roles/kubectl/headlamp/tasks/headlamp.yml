---
- name: Render headlamp-values.yaml
  ansible.builtin.template:
    src: headlamp-values.yaml.j2
    dest: "{{ headlamp_remote_dir }}/headlamp-values.yaml"
    mode: "0600"

- name: Render headlamp RBAC manifest
  ansible.builtin.template:
    src: headlamp-rbac.yaml.j2
    dest: "{{ headlamp_remote_dir }}/headlamp-rbac.yaml"
    mode: "0600"

# ── 映像枚舉預檢(對應 headlamp-offline.md 2.4),避免 tag 沒推對而 ImagePullBackOff ──
- name: Render Headlamp chart templates for image audit
  ansible.builtin.command:
    argv:
      - "{{ headlamp_helm_bin }}"
      - template
      - headlamp
      - "{{ nexus_helm_repo_name }}/headlamp"
      - --version
      - "{{ headlamp_chart_version }}"
      - -n
      - "{{ headlamp_namespace }}"
      - --set
      - "image.registry={{ registry_host }}"
      - --set
      - "image.repository={{ headlamp_image_repository }}"
      - --set
      - "image.tag={{ headlamp_image_tag }}"
  register: headlamp_template
  changed_when: false

- name: Extract Headlamp image references
  ansible.builtin.set_fact:
    headlamp_images: "{{ headlamp_template.stdout | regex_findall('image:\\s*\"?([^\"\\s]+)\"?') }}"

- name: Fail if any Headlamp image does not come from Nexus registry
  ansible.builtin.assert:
    that: "item.startswith(registry_host ~ '/')"
    fail_msg: "Image 未指向 {{ registry_host }},先依 headlamp-offline.md 2.1/2.2 補推: {{ item }}"
  loop: "{{ headlamp_images }}"

# ── 安裝 ──
- name: Install/upgrade Headlamp
  ansible.builtin.command:
    argv:
      - "{{ headlamp_helm_bin }}"
      - --kubeconfig={{ headlamp_kubeconfig }}
      - upgrade
      - --install
      - headlamp
      - "{{ nexus_helm_repo_name }}/headlamp"
      - --version
      - "{{ headlamp_chart_version }}"
      - -n
      - "{{ headlamp_namespace }}"
      - -f
      - "{{ headlamp_remote_dir }}/headlamp-values.yaml"
  register: headlamp_install
  # helm upgrade --install 的純 CLI 輸出無法可靠判斷是否真的無變化(沒有 kubernetes.core/helm-diff
  # 可用來做 dry-run diff),因此一律視為 changed——這是刻意的房規取捨,不是遺漏。
  changed_when: true

- name: Apply Headlamp RBAC (ServiceAccount / ClusterRoleBinding / token Secret)
  ansible.builtin.command:
    argv:
      - "{{ headlamp_kubectl_bin }}"
      - --kubeconfig={{ headlamp_kubeconfig }}
      - apply
      - -f
      - "{{ headlamp_remote_dir }}/headlamp-rbac.yaml"
  register: headlamp_rbac_apply
  changed_when: headlamp_rbac_apply.stdout is search('(created|configured)')

- name: Wait for Headlamp rollout
  ansible.builtin.command:
    argv:
      - "{{ headlamp_kubectl_bin }}"
      - --kubeconfig={{ headlamp_kubeconfig }}
      - -n
      - "{{ headlamp_namespace }}"
      - rollout
      - status
      - deploy/headlamp
      - --timeout=180s
  changed_when: false

# ── Token(可選,預設關閉印出,避免 cluster-admin 權限的憑證外洩到 ansible log)──
- name: Fetch Headlamp long-term token secret
  ansible.builtin.command:
    argv:
      - "{{ headlamp_kubectl_bin }}"
      - --kubeconfig={{ headlamp_kubeconfig }}
      - -n
      - "{{ headlamp_namespace }}"
      - get
      - secret
      - "{{ headlamp_admin_sa }}-token"
      - -o
      - jsonpath={.data.token}
  register: headlamp_token_b64
  changed_when: false
  no_log: true
  when: headlamp_create_long_term_token

- name: Show decoded Headlamp token (opt-in only)
  ansible.builtin.debug:
    msg: "{{ headlamp_token_b64.stdout | b64decode }}"
  when: headlamp_create_long_term_token and headlamp_show_token

- name: Issue one-off temporary token (opt-in only)
  ansible.builtin.command:
    argv:
      - "{{ headlamp_kubectl_bin }}"
      - --kubeconfig={{ headlamp_kubeconfig }}
      - create
      - token
      - "{{ headlamp_admin_sa }}"
      - -n
      - "{{ headlamp_namespace }}"
  register: headlamp_temp_token
  changed_when: false
  no_log: true
  when: headlamp_print_temp_token

- name: Show temporary token (opt-in only)
  ansible.builtin.debug:
    msg: "{{ headlamp_temp_token.stdout }}"
  when: headlamp_print_temp_token
