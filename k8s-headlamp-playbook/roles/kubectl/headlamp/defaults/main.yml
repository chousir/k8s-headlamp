---
# kubectl/helm 直接吃 root 的預設 kubeconfig(~/.kube/config),單一叢集不需指定。
# render 出的 helm values 固定放 /etc/helm(需預先存在)。
# 登入 Headlamp 用環境既有的 ServiceAccount kube-system/admin,本 role 不另建登入帳號。
# nexus_helm_repo_url / registry_host 定義在 inventory/group_vars/all.yml。

# ── 版本(只在升版時改,新版素材須已推上 Nexus)──
headlamp_chart_version: "0.43.0"
headlamp_image_tag: "v0.43.0"
prometheus_chart_version: "81.6.9"     # appVersion 必須等於叢集已裝的 prometheus-operator CRD 版本(v0.88.1)

# ── 視環境調整 ──
headlamp_service_type: LoadBalancer    # 沒有 MetalLB 時改 NodePort
prometheus_retention: 24h
prometheus_resources_requests_cpu: 100m
prometheus_resources_requests_memory: 1Gi
prometheus_resources_limits_memory: 2Gi
